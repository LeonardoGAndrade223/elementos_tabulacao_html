<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Tabela de cores</title>
    </head>
    <body>
        <main>
            <table border="1" style="width: 100%;">
                <thead>
                    <tr>
                        <th style="background-color: #9400d3; color: white;">Cabeçalho 1</th>
                        <th style="background-color: #9400d3; color: white;">Cabeçalho 2</th>
                        <th style="background-color: #9400d3; color: white;">Cabeçalho 3</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="background-color: black; color: white;">Conteúdo 1</td>
                        <td>
                            <table border="1" style="width: 100%;">
                                <tr>
                                    <td style="background-color: yellow;">1</td>
                                    <td style="background-color: red; color: white; text-align: right;">2</td>
                                </tr>
                                <tr>
                                    <td style="background-color: blue; color: white; text-align: right;">3</td>
                                    <td style="background-color: lime;">4</td>
                                </tr>
                            </table>
                        </td>
                        <td style="background: linear-gradient(to right, yellow, green, yellow,pink, rgb(151, 35, 35), orange, red, purple, rgb(151, 26, 107));">Conteúdo 3</td>
                    </tr>
                    <tr>
                        <td style="background-color: black; color: white;">Conteúdo 4</td>
                        <td style="background-image: url('fundo.png'); text-align:right ;">Conteúdo 5</td>
                        <td>
                            <table border="1" style="width: 100%;">
                                <tr>
                                    <td style="background-color: orange; text-align: center;">5</td>
                                    <td style="background-color: violet;">6</td>
                                </tr>
                                <tr>
                                    <td style="background-color: #ff0080; color: white; text-align: right;">7</td>
                                    <td style="background-color: orange; text-align: center
                                    ;">8</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
