<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Tabela de serviços mecânicos</title>
    </head>
    <body>
        <main>
            <table border="1" style="width: 100%;">
                <thead>
                    <tr>
                        <td colspan="5" style="text-align: center; background-color: #00e89b;"><h2>Tabela de Serviços Mecânicos</h2></td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th rowspan="5" style="background-color: #008b8b;">Nacionais</th>
                        <th style="background-color: #ccc;">Veículos</th>
                        <th style="background-color: #ccc;">Serviço</th>
                        <th style="background-color: #ccc;">Tempo Previsto</th>
                        <th style="background-color: #ccc;">Valor</th>
                    </tr>
                    <tr>
                        <td>Caminhonete S10</td>
                        <td>Suspensão</td>
                        <td style="text-align: center;">3 horas e 25 minutos</td>
                        <td style="text-align: right;">350,00</td>
                    </tr>
                    <tr>
                        <td>Caminhonete Ranger</td>
                        <td>Freio</td>
                        <td style="text-align: center;">3 horas e 45 minutos</td>
                        <td style="text-align: right;">200,00</td>
                    </tr>
                    <tr>
                        <td>Caminhonete Hilux</td>
                        <td>Troca de Bateria</td>
                        <td style="text-align: center;">30 minutos</td>
                        <td style="text-align: right;">25,00</td>
                    </tr>
                    <tr>
                        <td>Caminhonete D10</td>
                        <td>Alinhamento</td>
                        <td style="text-align: center;">1 hora e 40 minutos</td>
                        <td style="text-align: right;">220,00</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
